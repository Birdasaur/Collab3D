# Collaboration server defaults.
#
# Place this file next to Collab3DServer.exe (the directory the server is
# launched from). Any --tcpPort=, --udpPort=, or --maxClients=
# command-line argument overrides the matching line below; a line that is
# absent or commented out falls back to the built-in default in
# NetworkConstants.

tcpPort=6143
udpPort=6144
maxClients=12