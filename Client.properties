# Collaboration client connection defaults.
#
# Place this file next to Collab3DClient.exe (the directory the client is
# launched from). Any --host=, --tcpPort=, --udpPort=, or --name=
# command-line argument overrides the matching line below; a line that is
# absent or commented out falls back to the built-in default in
# NetworkConstants.

host=localhost
tcpPort=6143
udpPort=6144

# Uncomment to use a fixed display name instead of the random
# "Client-####" name generated when this is unset.
# name=Client